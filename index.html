.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}

.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.1rem}.timer.low{color:var(--bad)}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// build questions with deterministic option shuffle
const QS=BANK.map((b,i)=>{const o=[0,1,2,3],r=rng(i*7919+13);for(let k=3;k>0;k--){const j=Math.floor(r()*(k+1));[o[k],o[j]]=[o[j],o[k]]}
 return{q:b[0],opts:o.map(x=>b[1+x]),ans:o.indexOf(0),ex:b[5],ref:b[6]}});
// ---------- storage ----------
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
// ---------- Google Sheet upload ----------
const SHEET_URL="https://script.google.com/macros/s/AKfycbzar1S6buk2FogCqYDIIXiTwvszVxAJk6s2v64m5DQKHzavtzd2Ya2tFQ6wvjCAfGJ8pQ/exec";
function sheetRow(rec){return{id:rec.id,name:rec.n,district:rec.d,municipality:rec.m,designation:rec.g,wards:rec.wards,
 attempted:rec.att,correct:rec.c,wrong:rec.w,notAttempted:rec.u,total:N,autoSubmitted:rec.auto?"Yes":"No",
 started:new Date(rec.start).toLocaleString("en-IN"),submitted:new Date(rec.end).toLocaleString("en-IN"),
 answers:rec.answers.map((a,i)=>a<0?"-":"ABCD"[a]+(a===QS[i].ans?"✓":"✗")).join(" ")}}
async function sendOne(row){if(!/^https:\/\/script\.google\.com\//.test(SHEET_URL))return false;
 try{await fetch(SHEET_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)});return true}catch(e){return false}}
async function flushPending(){const q=LS.get("apq_pending")||[];if(!q.length)return true;const left=[];
 for(const r of q){if(!(await sendOne(r)))left.push(r)}LS.set("apq_pending",left);return!left.length}
async function saveResult(rec){const l=LS.get("apq_results")||[];l.push(rec);LS.set("apq_results",l);LS.set("apq_last",rec);
 const q=LS.get("apq_pending")||[];q.push(sheetRow(rec));LS.set("apq_pending",q);return flushPending()}

let S={view:"home"},T=null,tick=null,showPal=false;
function stat(rec){let c=0,w=0,u=0;QS.forEach((q,i)=>{const a=rec.answers[i];if(a==null||a<0)u++;else if(a===q.ans)c++;else w++});return{c,w,u,att:c+w}}
function go(v,x){S={...S,view:v,...x};render()}
// ---------- views ----------
function render(){clearInterval(tick);({home,form,quiz,result}[S.view])()}
function home(){app.innerHTML=`<div class="wrap"><h1>Election Officers' Handbook Quiz</h1><p class="mu">Nominations – Annexures 4 to 12 (Handbook pp. 123–146). ${N} multiple-choice questions · 60 minutes.</p>
<button class="p big" id="tt">Take Test<div class="mu" style="font-weight:400;color:inherit;opacity:.85">For Election Officers / Assistant Election Officers</div></button>
<p class="mu">Your score and report card are shown to you after you submit.</p></div>`;
 $("tt").onclick=()=>{const a=LS.get("apq_attempt");if(a&&Date.now()<a.start+DUR&&!a.done){T=a;go("quiz")}else go("form")}}
function form(){const f=S.f||{};app.innerHTML=`<div class="wrap"><button id="b">← Back</button><h2>Participant details</h2><div class="card">
<label>Name</label><input id="n" value="${esc(f.n||"")}" autocomplete="name">
<label>District</label><select id="d"><option value="">Select district</option>${Object.keys(ULB).map(d=>`<option ${f.d===d?"selected":""}>${esc(d)}</option>`).join("")}</select>
<label>Municipality</label><select id="m"></select>
<label>Designation</label><select id="g"><option value="">Select designation</option>${DESIG.map(d=>`<option ${f.g===d?"selected":""}>${esc(d)}</option>`).join("")}</select>
<label>Wards</label><input id="w" placeholder="e.g. 1, 2, 3 or 1–10" value="${esc(f.w||"")}">
<div class="err" id="e"></div><button class="p" id="s" style="width:100%">Start 60-minute test</button>
<p class="mu">The timer starts as soon as you tap Start. The quiz is submitted automatically when time ends.</p></div></div>`;
 const fm=()=>{const d=$("d").value;$("m").innerHTML=`<option value="">${d?"Select municipality":"Select district first"}</option>`+(ULB[d]||[]).map(m=>`<option ${f.m===m?"selected":""}>${esc(m)}</option>`).join("")};fm();$("d").onchange=()=>{f.m="";fm()};
 $("b").onclick=()=>go("home");
 $("s").onclick=()=>{const v={n:$("n").value.trim(),d:$("d").value,m:$("m").value,g:$("g").value,w:$("w").value.trim()};S.f=v;
  if(!v.n||!v.d||!v.m||!v.g||!v.w){$("e").textContent="Please fill in all the fields.";return}
  T={id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),info:v,start:Date.now(),answers:Array(N).fill(-1),marks:Array(N).fill(false),cur:0};LS.set("apq_attempt",T);go("quiz")}}
function quiz(){
 const draw=()=>{const q=QS[T.cur],a=T.answers[T.cur];
 app.innerHTML=`<div class="top"><div><b>Q ${T.cur+1}</b> / ${N}</div><div class="timer" id="tm"></div><button class="p" id="sub">Submit</button></div>
 <div class="wrap"><div class="layout"><div><div class="card"><div class="mu">${esc(T.info.n)} · ${esc(T.info.m)}</div><h3 style="font-size:1.1rem;margin-top:10px">${T.cur+1}. ${esc(q.q)}</h3>
 ${q.opts.map((o,i)=>`<button class="opt ${a===i?"sel":""}" data-i="${i}"><b>${"ABCD"[i]}.</b><span>${esc(o)}</span></button>`).join("")}
 <div class="row" style="margin-top:8px"><button class="bm ${T.marks[T.cur]?"on":""}" id="bk">${T.marks[T.cur]?"★ Bookmarked":"☆ Bookmark for review"}</button><button id="cl" ${a<0?"disabled":""}>Clear answer</button></div></div>
 <div class="row"><button id="pv" ${T.cur==0?"disabled":""}>← Previous</button><span class="sp"></span><button class="pt" id="pt">Palette</button><span class="sp"></span><button class="p" id="nx" ${T.cur==N-1?"disabled":""}>Next →</button></div>
 <div class="card pt" id="pm" style="display:${showPal?"block":"none"}">${pal()}</div></div>
 <div class="card side" style="margin-top:0;align-self:start;position:sticky;top:60px">${palHidden()}</div></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{T.answers[T.cur]=+b.dataset.i;sv();draw()});
 $("bk").onclick=()=>{T.marks[T.cur]=!T.marks[T.cur];sv();draw()};$("cl").onclick=()=>{T.answers[T.cur]=-1;sv();draw()};
 $("pv").onclick=()=>{T.cur--;sv();draw()};$("nx").onclick=()=>{T.cur++;sv();draw()};$("pt").onclick=()=>{showPal=!showPal;draw()};$("sub").onclick=confirmSub;
 document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{T.cur=+b.dataset.q;showPal=false;sv();draw();scrollTo(0,0)});tickf()};
 const pal=()=>`<h3>Question palette</h3><div class="pal">${T.answers.map((x,i)=>`<button data-q="${i}" class="${T.marks[i]?"b":x>=0?"a":""} ${i==T.cur?"cur":""}">${i+1}</button>`).join("")}</div><div class="lg"><span><i style="background:var(--ok)"></i>Answered</span><span><i style="background:var(--gr)"></i>Not answered</span><span><i style="background:var(--bl)"></i>Bookmarked</span></div>`;
 const palHidden=()=>`<div class="sidepal">${pal()}</div>`;
 const sv=()=>LS.set("apq_attempt",T);
 const tickf=()=>{const left=T.start+DUR-Date.now(),e=$("tm");if(left<=0){finish(true);return}
  if(e){const s=Math.floor(left/1000);e.textContent=`⏱ ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;e.className="timer"+(left<300000?" low":"")}};
 clearInterval(tick);tick=setInterval(tickf,1000);draw()}
function confirmSub(){const a=T.answers.filter(x=>x>=0).length,b=T.marks.filter(Boolean).length,m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="card"><h2>Submit the test?</h2><p>Answered: <b>${a}</b> · Not answered: <b>${N-a}</b> · Bookmarked: <b>${b}</b></p><p class="mu">Once submitted, you cannot change your answers.</p><div class="row"><button class="sp" id="no">Go back</button><button class="p sp" id="yes">Yes, submit</button></div></div>`;
 document.body.appendChild(m);$("no").onclick=()=>m.remove();$("yes").onclick=()=>{m.remove();finish(false)}}
let busy=false;
async function finish(auto){if(busy||!T)return;busy=true;clearInterval(tick);document.querySelectorAll(".modal").forEach(x=>x.remove());
 app.innerHTML=`<div class="wrap"><div class="card">Submitting your answers…</div></div>`;
 const rec={id:T.id,...T.info,answers:T.answers,start:T.start,end:Date.now(),auto:!!auto,wards:T.info.w};Object.assign(rec,stat(rec));
 const sent=await saveResult(rec);LS.del("apq_attempt");T=null;busy=false;showPal=false;go("result",{rec,sent})}
function repHTML(rec){const s=stat(rec),g=[[],[],[]];QS.forEach((q,i)=>{const a=rec.answers[i];g[a==null||a<0?2:a===q.ans?0:1].push(i)});
 const card=(i,k)=>{const q=QS[i],a=rec.answers[i],t=a>=0?`${"ABCD"[a]}. ${q.opts[a]}`:"Not attempted";
 return`<div class="card qc ${k}"><div class="mu">Question ${i+1}</div><div><b>${esc(q.q)}</b></div>
 <p style="margin:8px 0 2px"><span class="tag ${k}">Marked</span> ${esc(t)}</p><p style="margin:2px 0"><span class="tag ok">Correct</span> ${"ABCD"[q.ans]}. ${esc(q.opts[q.ans])}</p>
 <div class="ex"><b>Explanation:</b> ${esc(q.ex)}<br><span class="mu">📖 ${esc(q.ref)}</span></div></div>`};
 const sec=(t,k,l)=>`<h2>${t} (${l.length})</h2>${l.length?l.map(i=>card(i,k)).join(""):'<p class="mu">None.</p>'}`;
 return`<div class="card"><h2>${esc(rec.n)}</h2><div class="mu">${esc(rec.g)}<br>${esc(rec.m)}, ${esc(rec.d)} · Wards: ${esc(rec.wards??rec.w)}<br>Submitted ${new Date(rec.end).toLocaleString()}${rec.auto?" (auto-submitted on time-out)":""}</div>
 <div class="stats" style="margin-top:12px"><div class="stat"><b>${s.c} / ${N}</b>Score</div><div class="stat"><b>${s.att}</b>Attempted</div><div class="stat"><b style="color:var(--ok)">${s.c}</b>Correct</div><div class="stat"><b style="color:var(--bad)">${s.w}</b>Wrong</div><div class="stat"><b>${s.u}</b>Not attempted</div></div></div>`
 +sec("✅ Correct answers","ok",g[0])+sec("❌ Incorrect answers","bad",g[1])+sec("⚪ Unattempted","na",g[2])}
function result(){const{rec,sent}=S;app.innerHTML=`<div class="wrap"><h1>Test submitted</h1>${sent?"":`<div class="card mu">Your result could not be sent right now (no internet?). It is saved on this device and will be sent automatically the next time you open this page while online.</div>`}${repHTML(rec)}<button id="h" class="p">Home</button></div>`;$("h").onclick=()=>go("home");scrollTo(0,0)}
flushPending();render();
</script></body></html>
